name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare build folders & configure Flutter
        run: |
          flutter config --no-enable-swift-package-manager || true
          mkdir -p build/ios/SourcePackages
          mkdir -p ios/Flutter/ephemeral/Packages

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Release Unsigned)
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "==================== XCODE ERROR SUMMARY ===================="
            grep -i -C 2 -E "error:|fatal error|BUILD FAILED|signing" build.log || cat build.log
            echo "============================================================="
            exit $STATUS
          fi

      - name: Package IPA Payload
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r KasirKu.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasirKu-iOS-IPA
          path: KasirKu.ipa
          retention-days: 14
