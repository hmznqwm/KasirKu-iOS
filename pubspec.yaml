name: kasirku_mobile
description: KasirKu - Aplikasi Kasir Mobile (Flutter/Dart), backend PHP + MySQL
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3+1
  path: ^1.9.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.68.0
  fluttertoast: ^9.1.0
  url_launcher: ^6.3.1
  file_picker: ^10.3.10
  csv: ^6.0.0
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  excel: ^4.0.6
  supabase_flutter: ^2.17.2
  connectivity_plus: ^7.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  googleapis_auth: ^2.3.4
  http: ^1.6.0
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
